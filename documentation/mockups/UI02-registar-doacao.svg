  <g fill="none" stroke="#333">
    <rect x="20" y="235" width="860" height="40"/><rect x="30" y="242" width="340" height="26"/><rect x="400" y="242" width="130" height="26"/><rect x="560" y="242" width="150" height="26"/>
    <rect x="20" y="275" width="860" height="40"/><rect x="30" y="282" width="340" height="26"/><rect x="400" y="282" width="130" height="26"/><rect x="560" y="282" width="150" height="26"/>
  </g>
  <text x="40" y="260" fill="#777">Leite UHT meio-gordo (l) v</text><text x="410" y="260" fill="#777">120</text><text x="570" y="260" fill="#777">17/11/2026</text><text x="740" y="260">x remover</text>
  <text x="40" y="300" fill="#777">Atum em lata (un) v</text><text x="410" y="300" fill="#777">150</text><text x="570" y="300" fill="#777">22/11/2027</text><text x="740" y="300">x remover</text>
  <rect x="20" y="330" width="140" height="30" fill="#eee" stroke="#333"/><text x="35" y="350">+ Adicionar lote</text>
