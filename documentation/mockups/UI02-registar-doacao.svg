  <text x="340" y="120">Armazém</text><rect x="340" y="128" width="240" height="30" fill="none" stroke="#333"/><text x="350" y="148" fill="#777">Armazém Central de Aveiro v</text>
  <text x="600" y="120">Data</text><rect x="600" y="128" width="150" height="30" fill="none" stroke="#333"/><text x="610" y="148" fill="#777">18/10/2026</text>
