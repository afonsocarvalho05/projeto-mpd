  <rect x="20" y="400" width="160" height="38" fill="#ccc" stroke="#333"/><text x="45" y="424" font-weight="bold">Gravar doação</text>
  <rect x="200" y="400" width="110" height="38" fill="#fff" stroke="#333"/><text x="225" y="424">Cancelar</text>
  <rect x="20" y="460" width="560" height="34" fill="#f4f4f4" stroke="#999" stroke-dasharray="4"/>
  <text x="32" y="482" fill="#a00">Erro: BR09 — a validade do lote tem de ser posterior à data da doação.</text>
  <text x="20" y="530" fill="#666" font-size="12">FR04 — doação + vários lotes gravados numa única transação; erros de regra mostrados ao utilizador</text>
