{% extends "base.html" %}
{% block conteudo %}
<h1>Registar doação</h1>
<form class="cartao" method="post">
  <div class="campos">
    <label>Doador
      <select name="doador" required>{% for d in doadores %}<option value="{{ d.id_doador }}">{{ d.nome }}</option>{% endfor %}</select></label>
    <label>Armazém
      <select name="armazem" required>{% for a in armazens %}<option value="{{ a.id_armazem }}">{{ a.nome }}</option>{% endfor %}</select></label>
    <label>Data <input type="date" name="data" value="{{ hoje.isoformat() }}" required></label>
    <label>Observações <input name="observacoes"></label>
  </div>
  <h2>Lotes</h2>
  <div id="lotes">
    <div class="linha-lote">
      <select name="produto"><option value="">— produto —</option>
        {% for p in produtos %}<option value="{{ p.id_produto }}">{{ p.nome }} ({{ p.unidade_medida }})</option>{% endfor %}</select>
      <input type="number" name="quantidade" step="0.01" placeholder="quantidade">
      <input type="date" name="validade" title="validade">
    </div>
  </div>
  <p><button type="button" class="secundario" onclick="adicionarLote()">+ Adicionar lote</button></p>
  <button type="submit">Gravar doação</button>
  <p class="dica">A doação e os lotes são gravados numa única transação: se um lote violar uma regra (ex.: BR09), nada é gravado.</p>
</form>
<script>
function adicionarLote() {
  const linhas = document.getElementById('lotes');
  const nova = linhas.firstElementChild.cloneNode(true);
  nova.querySelectorAll('input, select').forEach(e => e.value = '');
  linhas.appendChild(nova);
}
</script>
{% endblock %}
